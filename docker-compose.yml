services:
  db:
    image: postgres:16
    container_name: fliptrack-db
    environment:
      POSTGRES_USER: fliptrack
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fliptrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not container status: Postgres accepts connections later
      # than the process starts.
      test: ["CMD-SHELL", "pg_isready -U fliptrack -d fliptrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
