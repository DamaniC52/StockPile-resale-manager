# Local development infrastructure.
#
# Why Docker for the database instead of installing Postgres on Windows:
#   - The version is pinned in this file, so your machine and Render run the same
#     major version. "Works locally, breaks in prod" is very often a version gap.
#   - `docker compose down -v` gives you a clean database in seconds, which makes
#     testing migrations from scratch cheap.
#   - Nothing is installed globally on your machine.

services:
  db:
    image: postgres:16
    container_name: fliptrack-db
    environment:
      POSTGRES_USER: fliptrack
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fliptrack
    ports:
      # host:container. Exposing 5432 lets the app (running outside Docker)
      # connect at localhost:5432.
      - "5432:5432"
    volumes:
      # A *named volume* keeps table data alive across `docker compose down`.
      # Without this, every restart would wipe the database.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # There are two different meanings of "up" and confusing them wastes an
      # afternoon: the container process can be running while Postgres is still
      # doing crash recovery and refusing connections. pg_isready tests the real
      # thing, so `docker compose ps` showing (healthy) means "accepting queries".
      test: ["CMD-SHELL", "pg_isready -U fliptrack -d fliptrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
